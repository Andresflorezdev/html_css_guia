<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01 - Estructura básica</title>
</head>

<body>
    <!-- La estructura mínima de una página HTML -->
    <h1>Mi primera página</h1>
    <p>Esta es la estructura mínima de una página HTML.</p>

    <!-- Ejercicio para practicar la base -->
    <section>
        <h2>Ejercicio</h2>
        <p>Agrega un encabezado, una sección de contenido y un pie de página usando solo HTML.</p>
        <ul>
            <li>Incluye un título principal.</li>
            <li>Escribe dos párrafos.</li>
            <li>Agrega un enlace a otra página o sección.</li>
        </ul>
    </section>
</body>

</html>
