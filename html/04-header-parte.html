<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04 - Parte Header</title>
    <link rel="stylesheet" href="../css/02-estilos-completos.css">
</head>

<body>
    <!-- Parte 1: Header -->
    <header class="site-header">
        <div class="container hero-layout">
            <div class="hero-copy">
                <p class="eyebrow">Parte Header</p>
                <h1>Encabezado de una página web</h1>
                <p>Este bloque suele llevar el título principal, una breve descripción y botones de acción.</p>
                <div class="hero-actions">
                    <a class="button button-primary" href="#">Botón principal</a>
                    <a class="button button-secondary" href="#">Botón secundario</a>
                </div>
            </div>

            <aside class="hero-panel" aria-label="Consejo">
                <p class="panel-title">Tip</p>
                <p>El header debe comunicar rápido de qué trata la página.</p>
            </aside>
        </div>
    </header>
</body>

</html>
